<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      const BASE = '/it-cube';
      let path = window.location.pathname
        + window.location.search
        + window.location.hash;
      if (path.startsWith(BASE)) {
        path = path.slice(BASE.length);
      }
      const redirectTo = BASE + '/#' + (path || '/');
      window.location.replace(redirectTo);
    })();
  </script>
